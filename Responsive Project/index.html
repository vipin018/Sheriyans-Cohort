<!DOCTYPE html>
<html>
<head>
    <title>Yellow Space Portal</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: black;
        }
        canvas { 
            display: block; 
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Yellow circular portal
        const portalGeometry = new THREE.RingGeometry(1, 1.5, 64);
        const portalMaterial = new THREE.MeshBasicMaterial({
            color: 0xffff00, // Bright yellow
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.9
        });
        const portal = new THREE.Mesh(portalGeometry, portalMaterial);
        scene.add(portal);

        // Bright glow effect for portal
        const glowGeometry = new THREE.RingGeometry(1.5, 2, 64);
        const glowMaterial = new THREE.MeshBasicMaterial({
            color: 0xffff00, // Bright yellow
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.4
        });
        const glow = new THREE.Mesh(glowGeometry, glowMaterial);
        scene.add(glow);

        // Stars with gradient trails (white front, orange middle, dark blue end)
        const stars = [];
        
        function createStar() {
            // Star body (bright white front)
            const starGeometry = new THREE.SphereGeometry(0.05, 16, 16);
            const starMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff }); // Bright white
            const star = new THREE.Mesh(starGeometry, starMaterial);
            
            star.position.set(
                (Math.random() - 0.5) * 70,
                (Math.random() - 0.5) * 70,
                -Math.random() * 70
            );
            
            // Gradient trail (white -> orange -> dark blue)
            const trailGeometry = new THREE.BufferGeometry();
            const trailPositions = new Float32Array(90); // 30 points * 3 (x,y,z) for smoother trail
            const trailColors = new Float32Array(90);   // Colors for each vertex
            
            const trail = new THREE.Line(
                trailGeometry,
                new THREE.LineBasicMaterial({ 
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.6
                })
            );
            
            star.trail = trail;
            star.trailPositions = [];
            star.trailColors = [];
            scene.add(trail);
            
            stars.push(star);
            scene.add(star);
        }

        // Create 1500 stars
        for (let i = 0; i < 500; i++) {
            createStar();
        }

        camera.position.z = 5;

        // Animation
        function animate() {
            requestAnimationFrame(animate);

            // Portal pulsation (no rotation)
            // const scale = 1 + Math.sin(Date.now() * 0.002) * 0.15;
            // portal.scale.set(scale, scale, 1);
            // glow.scale.set(scale, scale, 1);

            // Stars animation
            stars.forEach((star, index) => {
                star.position.z += 0.3;
                
                star.trailPositions.push([
                    star.position.x,
                    star.position.y,
                    star.position.z
                ]);
                
                // Generate gradient colors for trail
                star.trailColors.push(
                    new THREE.Color(0xffffff), // Bright white (front)
                    // new THREE.Color(0xff8000), // Orange (middle)
                    // new THREE.Color(0x00008b)  // Dark blue (end)
                );
                
                if (star.trailPositions.length > 30) {
                    star.trailPositions.shift();
                    star.trailColors.shift();
                }
                
                const positions = new Float32Array(star.trailPositions.flat());
                const colors = new Float32Array(star.trailColors.flatMap(c => [c.r, c.g, c.b]).flat());
                
                star.trail.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                star.trail.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                
                star.trail.geometry.attributes.position.needsUpdate = true;
                star.trail.geometry.attributes.color.needsUpdate = true;

                if (star.position.z > 5) {
                    scene.remove(star);
                    scene.remove(star.trail);
                    stars.splice(index, 1);
                    createStar();
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
