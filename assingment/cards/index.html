<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Product Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Modern Product Showcase</h1>
        <div class="grid">
            <div class="product">
                <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=1925&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Stylish Sneakers">
                <h3>Stylish Sneakers</h3>
                <p>$59.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product">
                <img src="https://img.freepik.com/free-photo/men-casual-trendy-fashion-with-black-jacket-accessories_1357-163.jpg?t=st=1738942898~exp=1738946498~hmac=b80230ab20fa0ec56ea2fe626924fed92a48512404c20bfe01d90b85e8806912&w=996" alt="Leather Jacket">
                <h3>Leather Jacket</h3>
                <p>$99.99</p>
                <button>Add to Cart</button>
            </div>
            
            <div class="product">
                <img src="https://images.unsplash.com/photo-1588514912908-8f5891714f8d?q=80&w=2069&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Perfume">
                <h3>Perfume</h3>
                <p>$99.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product">
                <img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?q=80&w=2065&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Wireless Headphones">
                <h3>Wireless Headphones</h3>
                <p>$79.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product">
                <img src="https://images.unsplash.com/photo-1736417670848-a2b516cb9aa3?q=80&w=1932&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Smartwatch">
                <h3>Smartwatch</h3>
                <p>$129.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product">
                <img src="https://images.unsplash.com/photo-1635048424329-a9bfb146d7aa?q=80&w=1931&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Gaming Mouse">
                <h3>PS5 Controller</h3>
                <p>$49.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product">
                <img src="https://img.freepik.com/free-photo/concept-school-education-with-school-accessories-space-text_185193-109800.jpg?t=st=1738943156~exp=1738946756~hmac=e236a5a2df896561f0d33778af0f47ef5d3346ec53220169968ee83ec103d6bf&w=996" alt="Minimalist Backpack">
                <h3>Minimalist Backpack</h3>
                <p>$39.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product">
                <img src="https://img.freepik.com/free-vector/portable-speaker-with-digital-radio-clock-illustration_1441-2614.jpg?t=st=1738943407~exp=1738947007~hmac=40e6b1b82b84a861777578d301e8ece4c4e6a053791c5eb7eb214f866b54ea11&w=1060" alt="Bluetooth Speaker">
                <h3>Bluetooth Speaker</h3>
                <p>$69.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product">
                <img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083?q=80&w=1780&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Classic Sunglasses">
                <h3>Classic Sunglasses</h3>
                <p>$29.99</p>
                <button>Add to Cart</button>
            </div>
            
        </div>
    </div>
</body>
</html>
