<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
    <div style="justify-content: center; align-items: center; display: flex; flex-direction: column; margin-top: 100px; font-family: 'Gilroy', Times, serif; font-size: 20px; font-weight: 900;" class="container">
        <h1>Get in Touch</h1>
        <p class="description">We'd love to hear from you. Please fill out the form below.</p>
        
        <form id="contactForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    required 
                    minlength="2"
                    placeholder="John Doe"
                    pattern="[A-Za-z\s]+"
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required
                    placeholder="john@example.com"
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    required
                    placeholder="(123) 456-7890"
                    pattern="[\d\s\(\)\-\+]+"
                >
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea 
                    id="message" 
                    name="message" 
                    required
                    minlength="10"
                    placeholder="Your message here..."
                ></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </div>

</body>
</html>
