<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>

<style>
    .container{
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-left: 25%;
        width: 50%;
        border: 1px solid #000;
        padding: 20px;
        margin-top: 100px;
        margin-bottom: 100px;
        border-radius: 60px;
        
    }
    .form-group{
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-top: 10px;
    }   
    .form-group label{
        margin-bottom: 10px;
    }
    .form-group input{
        margin-bottom: 10px;
    }
    .form-group textarea{
        margin-bottom: 10px;
    }
    .form-group button{
        margin-bottom: 10px;
    }
    .form-group button:hover{
        background-color: #000;
        color: #fff;
    }
    .description{
        font-size: 16px;
        font-weight: 400;
        color: #666;
    }
    .container h1{
        font-size: 40px;
        font-weight: 900;
    }
    .container p{
        font-size: 16px;
        font-weight: 400;
        color: #666;
    }
    .container button{
        background-color: #000;
        color: #fff;
        padding: 10px 20px;
        border-radius: 5px;
        border: none;
    }
    .container button:hover{
        background-color: #000;
        color: #fff;
    }
    .form-group input, .form-group textarea{
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }   
    .form-group input:focus, .form-group textarea:focus{
        outline: none;
        border: 1px solid #000;
    }
    .form-group input:invalid, .form-group textarea:invalid{
        border: 1px solid rgb(0, 0, 0);
    }
    .form-group input:valid, .form-group textarea:valid{
        border: 1px solid green;
    }
    
</style>

<body>
    <div style="justify-content: center; align-items: center; display: flex; flex-direction: column; margin-top: 100px; font-family: 'Gilroy', Times, serif; font-size: 20px; font-weight: 900;" class="container">
        <h1>Contact Page</h1>
        <p class="description">Please fill out the form below to contact us.</p>
        
        <form id="contactForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    required 
                    minlength="2"
                    placeholder="Vipin Pathak"
                    pattern="[A-Za-z\s]+"
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required
                    placeholder="vipinpathak018@example.com"
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    required
                    placeholder="+91 630619XXXX"
                    pattern="[\d\s\(\)\-\+]+"
                >
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea 
                    id="message" 
                    name="message" 
                    required
                    minlength="10"
                    placeholder="Please enter your message here..."
                ></textarea>
            </div>

            <button  type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
